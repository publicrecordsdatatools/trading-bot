name: lab-backtest
# Aggressive lab (paper-only experiments). Run by hand from the Actions tab; commits the report to reports/
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/lab_backtest.py --refresh
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "Lab backtest report $(date -u +%F)" || echo "No changes"
          git push
