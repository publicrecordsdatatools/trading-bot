name: paper-trade
# Runs about 15 minutes before the US close on weekdays. Two times cover daylight saving
# (19:45 and 20:45 UTC); the runner skips when the market is closed and is safe to run twice.
# Trades the main strategy, then the aggressive lab strategy in its own paper account.
# Each one is skipped until its Alpaca keys are added as repo secrets.
on:
  schedule:
    - cron: "45 19,20 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-trade
jobs:
  trade:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_LAB_API_KEY: ${{ secrets.ALPACA_LAB_API_KEY }}
      ALPACA_LAB_SECRET_KEY: ${{ secrets.ALPACA_LAB_SECRET_KEY }}
      PYTHONPATH: src
    steps:
      - name: Check which accounts have keys
        id: keys
        run: |
          echo "main=$([ -n "$ALPACA_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "lab=$([ -n "$ALPACA_LAB_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -n "$ALPACA_API_KEY" ] || echo "Main Alpaca secrets not set; skipping main account."
          [ -n "$ALPACA_LAB_API_KEY" ] || echo "Lab Alpaca secrets not set; skipping lab account."
      - uses: actions/checkout@v4
        if: steps.keys.outputs.main == 'true' || steps.keys.outputs.lab == 'true'
      - uses: actions/setup-python@v5
        if: steps.keys.outputs.main == 'true' || steps.keys.outputs.lab == 'true'
        with:
          python-version: "3.12"
      - if: steps.keys.outputs.main == 'true' || steps.keys.outputs.lab == 'true'
        run: pip install -r requirements.txt
      - name: Main strategy
        if: steps.keys.outputs.main == 'true'
        run: python -m tradingbot.runner --profile main
      - name: Lab strategy (paper only)
        if: always() && steps.keys.outputs.lab == 'true'
        run: python -m tradingbot.runner --profile lab
      - name: Commit logs and risk state
        if: always() && (steps.keys.outputs.main == 'true' || steps.keys.outputs.lab == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/
          git commit -m "Paper trade log $(date -u +%F)" || echo "No changes"
          git push
