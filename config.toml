# Trading system configuration. Risk limits here are enforced in code (src/tradingbot/risk.py).

[general]
benchmark = "SPY"
backtest_start = "2005-01-01"
# Walk-forward split: parameters are judged in-sample before this date, then checked out-of-sample after it.
out_of_sample_start = "2019-01-01"
# Per-trade cost as a fraction of traded value (commission + slippage).
cost_per_trade = 0.0005

[strategy]
# Which strategy the paper runner trades. One of: trend_sma, conservative_trend, dual_momentum, rsi_reversion, sector_rotation, rsi_basket
active = "sector_rotation"

[strategy.trend_sma]
symbol = "SPY"
safe_asset = "IEF"
sma_days = 200

[strategy.conservative_trend]
symbol = "SPY"
safe_asset = "IEF"
sma_days = 200
stock_weight = 0.4

[strategy.dual_momentum]
risk_assets = ["SPY", "QQQ", "EFA"]
safe_asset = "IEF"
lookback_days = 252

[strategy.rsi_reversion]
symbol = "SPY"
rsi_days = 2
entry_below = 10
exit_above = 70
trend_sma_days = 200

[strategy.sector_rotation]
risk_assets = ["XLK", "XLF", "XLE", "XLV", "XLI", "XLY", "XLP", "XLU", "XLB"]
safe_asset = "IEF"
market = "SPY"
top_n = 3
lookback_days = 63
market_sma_days = 200

[strategy.rsi_basket]
symbols = ["SPY", "QQQ", "IWM", "DIA"]
rsi_days = 2
entry_below = 10
exit_above = 70
trend_sma_days = 200

# Low-risk account: its own Alpaca paper account (secrets ALPACA_SAFE_API_KEY / ALPACA_SAFE_SECRET_KEY).
# Uses the main [risk] limits. Paper only for now.
[safe]
strategy = "conservative_trend"
# Buy fractions of a share, so a $1,000 account can hold its 40% slice of SPY.
fractional = true

# Aggressive lab: paper-only experiments with 3x leveraged ETFs (src/tradingbot/lab.py).
# The daily runner never trades these.
[lab]
crash_test_start = "1999-03-10"
# Calibrated so the simulated fund roughly matches real TQQQ where both exist (see the lab report).
leveraged_annual_drag = 0.05

[lab.lev_trend]
signal = "QQQ"
trade = "TQQQ"
sma_days = 200

[lab.lev_rotation]
lookback_days = 63
sma_days = 200

[lab.lev_rotation.pairs]
TQQQ = "QQQ"
UPRO = "SPY"
TNA = "IWM"
SOXL = "SOXX"

[lab.lev_dip]
signal = "QQQ"
trade = "TQQQ"
rsi_days = 2
entry_below = 10
exit_above = 70
trend_sma_days = 200

# Lab paper trading: its own Alpaca paper account (secrets ALPACA_LAB_API_KEY / ALPACA_LAB_SECRET_KEY).
# Always paper, never live. These limits replace the [risk] values for the lab account only,
# because 3x ETFs often move more than 3% in a day and the dip strategy buys after drops.
[lab.paper]
strategy = "lev_dip"
fractional = true
daily_loss_limit = 0.20
kill_switch_drawdown = 0.60
extra_etfs = ["TQQQ", "UPRO", "TNA", "SOXL", "SOXX"]

[risk]
max_single_stock_weight = 0.25
# ETFs may be held up to 100% of the account.
etfs = ["SPY", "QQQ", "EFA", "IEF", "TLT", "GLD", "BIL", "IWM", "DIA",
        "XLK", "XLF", "XLE", "XLV", "XLI", "XLY", "XLP", "XLU", "XLB"]
daily_loss_limit = 0.03
kill_switch_drawdown = 0.15
min_price = 5.0
min_avg_dollar_volume = 5_000_000
# Skip rebalancing a position if the change is smaller than this fraction of equity.
min_trade_fraction = 0.02

[live]
# Live trading also requires the env var TRADING_MODE=live. Leave false until Sam approves in writing.
enabled = false
max_capital = 1000
